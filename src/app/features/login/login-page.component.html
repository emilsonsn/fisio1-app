<section class="auth-shell">
  <app-auth-art />
  <div class="auth-panel">
    <form class="auth-card" (ngSubmit)="signIn()">
      <span class="eyebrow">Bem-vindo de volta</span>
      <h2>Acesse sua conta</h2>
      <p class="muted">Entre para acompanhar seus pacientes e registros.</p>
      <label class="field-label">E-mail</label>
      <div class="input-wrap">
        <span>♙</span><input name="email" [(ngModel)]="login.email" required />
      </div>
      <label class="field-label">Senha</label>
      <div class="input-wrap">
        <span>⌑</span
        ><input name="password" [(ngModel)]="login.password" type="password" required />
      </div>
      <div class="login-options">
        <span></span><a class="text-button" routerLink="/forgot-password">Esqueci minha senha</a>
      </div>
      <button class="primary-button auth-submit">Entrar <span>→</span></button>
      <div class="demo-access">
        <span>ACESSO DE DEMONSTRAÇÃO</span>
        <p>Usuário: <strong>andre</strong> · Senha: <strong>andre</strong></p>
      </div>
    </form>
  </div>
</section>
